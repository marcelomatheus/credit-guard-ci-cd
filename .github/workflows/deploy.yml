name: Release and deploy
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-credit-production
  cancel-in-progress: false
jobs:
  validate:
    name: Select the release version or run CI only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      revision: ${{ steps.version.outputs.revision }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout source, tags and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the stable version and reviewed commit
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release.mjs validate
  quality:
    needs: validate
    uses: ./.github/workflows/quality.yml
  tag:
    name: Create or verify the version tag
    needs: [validate, quality]
    if: vars.DEPLOY_ENABLED == 'true' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout verified release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - name: Create the tag and continue this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.revision }}
        run: node scripts/release.mjs tag
  publish:
    name: Publish and verify immutable image
    needs: [validate, quality, tag]
    if: vars.DEPLOY_ENABLED == 'true' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_ref: ${{ steps.reference.outputs.image_ref }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.revision }}
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$DOCKERHUB_IMAGE" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
      - name: Authenticate to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Resolve an existing version without replacing its image
        id: existing
        run: node scripts/release.mjs resolve
      - name: Build and publish
        if: steps.existing.outputs.reuse != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}:sha-${{ needs.validate.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            GIT_SHA=${{ needs.validate.outputs.revision }}
            APP_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Capture immutable reference
        id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REUSED_IMAGE_REF: ${{ steps.existing.outputs.image_ref }}
        run: |
          if [[ -n "$REUSED_IMAGE_REF" ]]; then
            image_ref=$REUSED_IMAGE_REF
          else
            [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            image_ref="$IMAGE@$DIGEST"
          fi
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'Version: %s\nImage: %s\n' "$RELEASE_VERSION" "$image_ref" >> "$GITHUB_STEP_SUMMARY"
      - name: Pull and smoke test the published digest
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image_ref }}
        run: |
          docker pull "$IMAGE_REF"
          bash scripts/test-image.sh "$IMAGE_REF" "$RELEASE_SHA" "$RELEASE_VERSION"
      - name: Scan the published image
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image_ref }}
        run: bash scripts/scan-image.sh "$IMAGE_REF"
      - name: Reserve the verified version tag
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image_ref }}
        run: node scripts/release.mjs promote
  deploy:
    name: Deploy to VPS through Tailscale
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PROJECT_PATH: ${{ vars.VPS_PROJECT_PATH }}
      IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
      RELEASE_SHA: ${{ needs.validate.outputs.revision }}
    steps:
      - name: Checkout release files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - name: Join the deployment tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.VPS_HOST }}
      - name: Prepare pinned SSH connection
        env:
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: bash scripts/prepare-ssh.sh
      - name: Transfer and deploy the release
        run: |
          release_id="$RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$RUNNER_TEMP/release"
          cp compose.production.yaml "$RUNNER_TEMP/release/compose.yaml"
          cp scripts/deploy.sh scripts/rollback.sh scripts/release-common.sh "$RUNNER_TEMP/release/"
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release" .
          checksum=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d ' ' -f 1)
          ssh -F "$HOME/.ssh/credit_config" credit-vps "umask 077; mkdir -p '$VPS_PROJECT_PATH/releases/$release_id'"
          scp -F "$HOME/.ssh/credit_config" "$RUNNER_TEMP/release.tar.gz" "credit-vps:$VPS_PROJECT_PATH/releases/$release_id/release.tar.gz"
          ssh -F "$HOME/.ssh/credit_config" credit-vps "cd '$VPS_PROJECT_PATH/releases/$release_id' && printf '%s  %s\n' '$checksum' release.tar.gz | sha256sum --check --status && tar -xzf release.tar.gz && rm release.tar.gz && bash deploy.sh '$VPS_PROJECT_PATH' '$release_id' '$IMAGE_REF'"
          printf 'Release: %s\nImage: %s\n' "$release_id" "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the public Cloudflare route
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          [[ "$PUBLIC_BASE_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          for _attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "$PUBLIC_BASE_URL/health/ready" > /dev/null && curl --fail --silent --show-error --max-time 10 "$PUBLIC_BASE_URL/version" | jq --exit-status --arg sha "$RELEASE_SHA" '.commit == $sha' > /dev/null; then
              printf 'Public route verified: %s\n' "$PUBLIC_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'Application passed internal checks, but the public route failed. Inspect Cloudflare Tunnel and Traefik.' >&2
          exit 1
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/credit_deploy_key" "$HOME/.ssh/credit_known_hosts" "$HOME/.ssh/credit_config"
  release:
    name: Publish the verified GitHub Release
    needs: [validate, publish, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.revision }}
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}
      IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - name: Authenticate to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Promote latest without downgrading a newer version
        id: latest
        run: node scripts/release.mjs latest
      - name: Publish release notes with the deployed digest
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ steps.latest.outputs.make_latest }}
        run: |
          node scripts/release.mjs publish
          printf 'GitHub Release: https://github.com/%s/releases/tag/v%s\nImage: %s\n' "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
  deployment-status:
    name: Explain why only CI ran
    needs: [validate, quality]
    if: vars.DEPLOY_ENABLED != 'true' || needs.validate.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Report release selection
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ "$DEPLOY_ENABLED" != true ]]; then
            echo 'CI passed. Configure the documented credentials and set DEPLOY_ENABLED=true to activate automatic version tags, Docker Hub publication, deployment and GitHub Releases.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'CI passed. Version v%s is already tagged. Bump the package and lockfile version in a PR to publish a new release.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
