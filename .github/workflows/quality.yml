name: Quality gates
on:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    name: Node 22 quality and container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck, test coverage and build
        run: npm run check
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Validate workflow files
        run: |
          npm run verify:workflows
          bash scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Validate shell scripts
        run: shellcheck -s bash -x -P scripts scripts/*.sh
      - name: Validate Compose manifests
        env:
          DOMAIN_NAME: credit-api.example.com
          IMAGE_REF: docker.io/example/pipeline-ci-cd@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          cp .env.example .env
          docker compose config --quiet
          RUNTIME_ENV_FILE="$PWD/.env" docker compose -f compose.production.yaml config --quiet
          docker compose --env-file infra/.env.example -f infra/compose.yaml config --quiet
          docker compose --env-file infra/observability/.env.example -f infra/observability/compose.yaml config --quiet
          docker compose --env-file infra/observability/.env.example -f infra/observability/compose.yaml -f infra/observability/compose.local.yaml config --quiet
      - name: Validate observability configuration
        run: |
          jq empty infra/observability/grafana/dashboards/*.json
          docker run --rm --entrypoint promtool --volume "$PWD/infra/observability:/config:ro" prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 check config /config/prometheus.yml
      - name: Build the Node 22 production image
        run: |
          version=$(node -p "require('./package.json').version")
          docker build --build-arg "GIT_SHA=$GITHUB_SHA" --build-arg "APP_VERSION=$version" --tag pipeline-credit-api:ci .
      - name: Test the production image
        run: |
          version=$(node -p "require('./package.json').version")
          bash scripts/test-image.sh pipeline-credit-api:ci "$GITHUB_SHA" "$version"
      - name: Scan the production image
        run: bash scripts/scan-image.sh pipeline-credit-api:ci
